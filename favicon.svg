<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 6 92 82">
  <!-- Logo de NovaDrop: la misma nube de tres lóbulos, más alta y compacta
       (casi cuadrada) para que llene el icono. Fuente de todos los iconos:
       scripts/build-icons.mjs. -->
  <defs>
    <linearGradient id="l" gradientUnits="userSpaceOnUse" x1="6" y1="34" x2="58" y2="86">
      <stop offset="0" stop-color="#FF8A00"/><stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>
    <linearGradient id="r" gradientUnits="userSpaceOnUse" x1="32" y1="34" x2="96" y2="86">
      <stop offset="0" stop-color="#FF4A00"/><stop offset="1" stop-color="#EE3300"/>
    </linearGradient>
    <clipPath id="top"><circle cx="51" cy="37" r="29"/></clipPath>
    <clipPath id="right"><circle cx="70" cy="60" r="26"/></clipPath>
  </defs>
  <!-- lóbulo derecho y base -->
  <circle cx="70" cy="60" r="26" fill="url(#r)"/>
  <rect x="32" y="60" width="38" height="26" fill="url(#r)"/>
  <!-- lóbulo superior y su cruce con el derecho -->
  <circle cx="51" cy="37" r="29" fill="#FF5200"/>
  <circle cx="70" cy="60" r="26" fill="#DD2C00" clip-path="url(#top)"/>
  <!-- lóbulo izquierdo (delante) y su cruce translúcido con el superior -->
  <path d="M32 34 A26 26 0 0 1 58 60 V86 H32 A26 26 0 0 1 32 34 Z" fill="url(#l)"/>
  <path d="M32 34 A26 26 0 0 1 58 60 V86 H32 A26 26 0 0 1 32 34 Z" fill="#E84000" opacity="0.55" clip-path="url(#top)"/>
  <g clip-path="url(#top)"><path d="M32 34 A26 26 0 0 1 58 60 V86 H32 Z" fill="#C42200" opacity="0.5" clip-path="url(#right)"/></g>
</svg>
