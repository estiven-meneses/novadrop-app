<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NovaDrop</title>
    <meta name="description" content="Guarda, organiza y encuentra tus marcadores desde cualquier dispositivo." />
    <link rel="icon" type="image/svg+xml" href="/novadrop-app/favicon.svg" />
    <link rel="icon" type="image/png" href="/novadrop-app/favicon.png" />
    <link rel="apple-touch-icon" href="/novadrop-app/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NovaDrop" />
    <!-- black-translucent + viewport-fit=cover: la app ocupa toda la pantalla y el
         área segura la gestiona el CSS (mobile-app.css). Es la combinación que usan
         Nexus Flow y CardPDF; con "default" iOS mide 100vh con la barra de estado
         y la barra inferior queda recortada. Al cambiarla hay que borrar la app de
         la pantalla de inicio y volver a añadirla. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1A1A" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Conexión anticipada a Supabase: la primera sincronización empieza antes. -->
    <link rel="preconnect" href="https://srxxffcuzlururvhwklg.supabase.co" crossorigin />
    <style>
      /* Color de fondo antes de que cargue la app: sin destello blanco en modo oscuro. */
      html { background: #FFFFFF; }
      @media (prefers-color-scheme: dark) { html { background: #1A1A1A; } }
    </style>
    <script>
      // iPhone con la app instalada: se marca antes del primer pintado para que
      // el alto (100vh) ya sea el correcto al medir (ver mobile-app.css).
      (function () {
        var d = document.documentElement;
        var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (ios) d.classList.add('is-ios');
        if (navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)) d.classList.add('is-standalone');
      })();
    </script>
    <script type="module" crossorigin src="/novadrop-app/assets/index-BpZAMeZE.js"></script>
    <link rel="modulepreload" crossorigin href="/novadrop-app/assets/ConfirmModal-7GhMX1AA.js">
    <link rel="stylesheet" crossorigin href="/novadrop-app/assets/index-DiWdrzNQ.css">
  <link rel="manifest" href="/novadrop-app/manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
  </body>
</html>
